[tool.bumpversion]
current_version = "0.2.10"
commit = true
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "setup.py"
search = "version      = '{current_version}',"
replace = "version      = '{new_version}',"

[[tool.bumpversion.files]]
filename = "scrapy_frontera/__init__.py"
