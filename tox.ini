[tox]
envlist = pre-commit,min,py39,py310,py311,py312,py313

[testenv]
deps =
    pytest
    pytest-twisted
commands =
    pytest {posargs:tests}

[testenv:min]
basepython = python3.9
deps =
    {[testenv]deps}
;     frontera==0.7.2
    scrapy==2.7.0
    w3lib==1.17.0

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all
