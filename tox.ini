[tox]
envlist = pre-commit,min,py39,py310,py311,py312,py313,hcf
# TODO: Add min-hcf

[testenv]
deps =
    pytest
    pytest-twisted
commands =
    pytest --reactor=asyncio {posargs:tests}

[testenv:hcf]
deps =
    {[testenv]deps}
    hcf-backend @ git+https://github.com/scrapinghub/hcf-backend.git@latest-frontera

[testenv:min]
basepython = python3.9
deps =
    {[testenv]deps}
;     frontera==0.7.2
    scrapy==2.7.0
    w3lib==1.17.0
    cssselect<1.3  # for w3lib==1.17.0

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all
